services:
  etl-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
      POSTGRES_DB: etl_database
    ports:
      - "5433:5432"
    volumes:
      - etl_postgres_data:/var/lib/postgresql/data
    networks:
      - belajar-airflow_eb855a_airflow

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    working_dir: /usr/app/dbt/openlibrary_dbt
    environment:
      DBT_PROFILES_DIR: /usr/app/dbt/openlibrary_dbt
    volumes:
      - ./dbt:/usr/app/dbt
    depends_on:
      - etl-postgres

volumes:
  etl_postgres_data:

networks:
  belajar-airflow_eb855a_airflow:
    external: true